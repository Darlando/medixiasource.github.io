<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produits - MEDIXIA MARKET</title>
    <meta name="description" content="Parcourez le catalogue de produits médicaux de MEDIXIA MARKET : équipements, accessoires et consommables pour professionnels de santé.">
    <meta name="keywords" content="produits médicaux, catalogue médical, équipement médical, accessoires médicaux, consommables médicaux">
    <meta name="author" content="MEDIXIA MARKET">
    <meta name="robots" content="index, follow">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header-inner">
            <div>
                <h1>MEDIXIA MARKET</h1>
            </div>
            <button class="nav-toggle" aria-expanded="false" aria-label="Ouvrir le menu">☰</button>
            <nav class="nav-links">
                <a href="index.html">Accueil</a>
                <a href="produits.html">Produits</a>
                <a href="apropos.html">A propos</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero hero-small">
            <h1>Nos produits</h1>
            <p>Découvrez l'ensemble de nos équipements médicaux chargés.</p>
        </section>

        <section class="container" id="catalogue">
            <div id="filter-container" class="filter-container">
                <div id="filter-buttons" class="filter-buttons">
                    <button class="filter-btn active" data-category="all">Tous les produits</button>
                </div>
            </div>
            <div id="products-container">
                <p class="loading">Chargement des produits...</p>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 MEDIXIA MARKET</p>
    </footer>

    <script>
        // ===============================
        // DONNÉES PRODUITS (fusionnées, plus besoin de fetch produits.json)
        // Chemins corrigés : tous les fichiers sont à la racine du Workspace,
        // il n'y a PAS de dossier assets/img/ dans TrebEdit.
        // ⚠️ Vérifie que chaque nom de fichier ci-dessous correspond EXACTEMENT
        // (majuscules, espaces, extension) au fichier réellement importé.
        // ===============================
        const products = [
            {
                img: "you.jpg",
                nom: "Tensiomètre Manuel",
                categorie: "Matériel Médical",
                description: "Appareil manuel pour mesurer la pression artérielle avec précision.",
                prix: "49,99 €"
            },
            {
                img: "site1.jpg",
                nom: "Tensiomètre Electronique",
                categorie: "Matériel Médical",
                description: "Mesure automatique de la tension artérielle en quelques secondes.",
                prix: "79,99 €"
            },
            {
                img: "OxymètreSaturometre.jpg",
                nom: "Oxymètre",
                categorie: "Matériel Médical",
                description: "Mesure la saturation en oxygène du sang et le pouls.",
                prix: "34,50 €"
            },
            {
                img: "Penlight rechargeable.jpg",
                nom: "Penlight Médical",
                categorie: "Accessoires Médicaux",
                description: "Lampe compacte pour les examens médicaux de précision.",
                prix: "12,00 €"
            },
            {
                img: "Otoscope.jpg",
                nom: "Stéthoscope Double Foyer",
                categorie: "Accessoires Médicaux",
                description: "Instrument professionnel pour écouter les sons du cœur et des poumons.",
                prix: "89,90 €"
            },
            {
                img: "Glucometre complet.jpg",
                nom: "Glucomètre Complet",
                categorie: "Équipements Médicaux",
                description: "Kit complet pour mesurer la glycémie avec résultats rapides.",
                prix: "69,90 €"
            },
            {
                img: "Surblouse.jpg",
                nom: "Blouse Manche Longue",
                categorie: "Vêtements Professionnels",
                description: "Blouse médicale confortable et résistante pour usage quotidien.",
                prix: "39,99 €"
            },
            {
                img: "Surblouse1.jpg",
                nom: "Blouse Manche Courte",
                categorie: "Vêtements Professionnels",
                description: "Blouse légère idéale pour le travail en environnement médical.",
                prix: "35,99 €"
            },
            {
                img: "Bonnet jetable.jpg",
                nom: "Lunettes Anti-Bleu",
                categorie: "Accessoires Médicaux",
                description: "Protection des yeux contre la lumière bleue et la fatigue visuelle.",
                prix: "24,50 €"
            },
            {
                img: "Bottine infirmière.jpeg",
                nom: "Bottines Infirmières",
                categorie: "Vêtements Professionnels",
                description: "Chaussures de travail confortables et antidérapantes.",
                prix: "59,90 €"
            },
            {
                img: "Thermomètre à mercure.jpg",
                nom: "Thermomètre Digital",
                categorie: "Consommables Médicaux",
                description: "Thermomètre rapide et précis pour usage quotidien.",
                prix: "15,90 €"
            },
            {
                img: "Bonnet jetable.jpg",
                nom: "Masque Chirurgical",
                categorie: "Consommables Médicaux",
                description: "Lot de masques pour la protection en milieu médical.",
                prix: "9,99 €"
            }
        ];

        document.addEventListener("DOMContentLoaded", function () {

            // ===============================
            // EFFET D'APPARITION AU SCROLL
            // ===============================
            function appearOnScroll() {
                const sections = document.querySelectorAll("section, .container");
                const windowBottom = window.innerHeight + window.scrollY;
                sections.forEach(sec => {
                    sec.style.opacity = 0;
                    sec.style.transition = "opacity 1s ease-out, transform 1s ease-out";
                    sec.style.transform = "translateY(30px)";
                    if (windowBottom > sec.offsetTop + 50) {
                        sec.style.opacity = 1;
                        sec.style.transform = "translateY(0)";
                    }
                });
            }
            window.addEventListener("scroll", appearOnScroll);

            // ===============================
            // MENU MOBILE
            // ===============================
            const navToggle = document.querySelector(".nav-toggle");
            const navLinks = document.querySelector(".nav-links");
            if (navToggle && navLinks) {
                navToggle.addEventListener("click", function () {
                    const isOpen = navLinks.classList.toggle("open");
                    navToggle.setAttribute("aria-expanded", isOpen.toString());
                });

                navLinks.querySelectorAll("a").forEach(link => {
                    link.addEventListener("click", () => {
                        navLinks.classList.remove("open");
                        navToggle.setAttribute("aria-expanded", "false");
                    });
                });
            }

            // ===============================
            // AFFICHAGE DES PRODUITS
            // ===============================
            function renderProducts(items) {
                const categories = [...new Set(items.map(p => p.categorie))];
                setupFilters(categories, items);
                displayProducts(items, "all");
                animateCards();
                appearOnScroll();
            }

            function setupFilters(categories, items) {
                const filterBtnContainer = document.querySelector("#filter-buttons");
                if (!filterBtnContainer) return;

                filterBtnContainer.innerHTML = '<button class="filter-btn active" data-category="all">Tous les produits</button>';

                categories.forEach(category => {
                    const btn = document.createElement("button");
                    btn.className = "filter-btn";
                    btn.setAttribute("data-category", category);
                    btn.textContent = category;
                    filterBtnContainer.appendChild(btn);
                });

                const filterButtons = filterBtnContainer.querySelectorAll(".filter-btn");
                filterButtons.forEach(btn => {
                    btn.addEventListener("click", () => {
                        filterButtons.forEach(b => b.classList.remove("active"));
                        btn.classList.add("active");
                        const selectedCategory = btn.getAttribute("data-category");
                        displayProducts(items, selectedCategory);
                    });
                });
            }

            function displayProducts(items, selectedCategory = "all") {
                const container = document.querySelector("#products-container");
                if (!container) return;

                let filtered = items;
                if (selectedCategory !== "all") {
                    filtered = items.filter(p => p.categorie === selectedCategory);
                }

                const categories = [...new Set(filtered.map(p => p.categorie))];

                container.innerHTML = categories.map(category => {
                    const cards = filtered
                        .filter(p => p.categorie === category)
                        .map(p => `
                            <article class="card">
                                <img src="${p.img}" alt="${p.nom}">
                                <div class="product-meta">
                                    <p class="category">${p.categorie}</p>
                                    <h3>${p.nom}</h3>
                                    <p>${p.description}</p>
                                    <p class="price">${p.prix}</p>
                                </div>
                            </article>
                        `).join("");

                    return `
                        <section class="product-section">
                            <h2>${category}</h2>
                            <div class="products">${cards}</div>
                        </section>
                    `;
                }).join("");

                if (filtered.length === 0) {
                    container.innerHTML = "<p class='no-results'>Aucun produit ne correspond à ce filtre.</p>";
                }

                animateCards();
                appearOnScroll();
            }

            function animateCards() {
                document.querySelectorAll(".card").forEach(card => {
                    card.style.transition = "transform 0.3s, box-shadow 0.3s";
                    card.addEventListener("mouseover", () => {
                        card.style.transform = "scale(1.07)";
                        card.style.boxShadow = "0 8px 20px rgba(0,0,0,0.3)";
                    });
                    card.addEventListener("mouseout", () => {
                        card.style.transform = "scale(1)";
                        card.style.boxShadow = "0 2px 8px rgba(0,0,0,0.1)";
                    });
                });
            }

            renderProducts(products);

            // ===============================
            // BOUTON HAUT DE PAGE
            // ===============================
            const btnTop = document.createElement("button");
            btnTop.className = "back-to-top";
            btnTop.setAttribute("aria-label", "Remonter en haut");
            btnTop.innerHTML = "↑";
            document.body.appendChild(btnTop);

            window.addEventListener("scroll", () => {
                btnTop.classList.toggle("show", window.scrollY > 200);
            });

            btnTop.addEventListener("click", () => {
                window.scrollTo({ top: 0, behavior: "smooth" });
            });

            appearOnScroll();
        });
    </script>
</body>

</html>
